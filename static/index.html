<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>J.A.R.V.I.S - Voice Assistant</title>
     <style>
         * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
         }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #0a0a0f 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #00d4ff;
         }

         .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
         }

         .particle {
            position: absolute;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 20s infinite;
         }

         @keyframes float {
             0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0; }
             10% { opacity: 0.5; }
             90% { opacity: 0.5; }
             100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
         }

         .header {
            position: relative;
            z-index: 1;
            text-align: center;
            margin-bottom: 40px;
            padding: 0 20px;
         }

         .title {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 8px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #00d4ff, #0099cc, #00d4ff);
            background-size: 200% auto;
             -webkit-background-clip: text;
             -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: glow 3s ease-in-out infinite;
         }

         @keyframes glow {
             0%, 100% { background-position: 0% center; }
             50% { background-position: 100% center; }
         }

         .subtitle {
            font-size: 0.9rem;
            color: rgba(0, 212, 255, 0.6);
            margin-top: 10px;
            letter-spacing: 2px;
         }

         .status-container {
            position: relative;
            z-index: 1;
            margin-bottom: 20px;
            text-align: center;
            padding: 0 20px;
         }

         .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 25px;
            font-size: 0.85rem;
            letter-spacing: 1px;
            transition: all 0.3s ease;
         }

         .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00d4ff;
            animation: pulse 2s infinite;
         }

         @keyframes pulse {
             0%, 100% { transform: scale(1); opacity: 1; }
             50% { transform: scale(1.3); opacity: 0.7; }
         }

         .status-dot.error {
            background: #ff4444;
            animation: none;
         }

         .button-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            padding: 20px;
         }

         .record-button {
            position: relative;
            width: 180px;
            height: 180px;
            border: none;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.2) 0%, rgba(0, 212, 255, 0.05) 70%, transparent 100%);
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
         }

         .record-button::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border-radius: 50%;
            border: 2px solid rgba(0, 212, 255, 0.3);
            animation: ring 3s ease-in-out infinite;
         }

         @keyframes ring {
             0%, 100% { transform: scale(1); opacity: 1; }
             50% { transform: scale(1.1); opacity: 0.5; }
         }

         .record-button.recording {
            background: radial-gradient(circle, rgba(0, 212, 255, 0.4) 0%, rgba(0, 212, 255, 0.1) 70%, transparent 100%);
            animation: pulse-button 1s ease-in-out infinite;
         }

         @keyframes pulse-button {
             0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(0, 212, 255, 0.5); }
             50% { transform: scale(0.95); box-shadow: 0 0 60px rgba(0, 212, 255, 0.8); }
         }

         .record-button.recording::before {
            animation: ring-recording 0.5s linear infinite;
         }

         @keyframes ring-recording {
             0% { transform: rotate(0deg); }
             100% { transform: rotate(360deg); }
         }

         .button-icon {
            width: 60px;
            height: 60px;
            fill: #00d4ff;
            filter: drop-shadow(0 0 15px rgba(0, 212, 255, 0.8));
            transition: all 0.3s ease;
         }

         .record-button.recording .button-icon {
            animation: mic-wiggle 0.5s ease-in-out infinite;
         }

         @keyframes mic-wiggle {
             0%, 100% { transform: rotate(0deg); }
             25% { transform: rotate(-5deg); }
             75% { transform: rotate(5deg); }
         }

         /* Wake word button */
         .wake-word-button {
            position: relative;
            padding: 12px 24px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1px;
            border: 2px solid rgba(0, 212, 255, 0.4);
            border-radius: 25px;
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 280px;
            justify-content: center;
         }

         .wake-word-button:hover {
            background: rgba(0, 212, 255, 0.2);
            border-color: rgba(0, 212, 255, 0.6);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
         }

         .wake-word-button.active {
            background: rgba(0, 255, 100, 0.15);
            border-color: #00ff64;
            color: #00ff64;
            animation: pulse-wake 2s infinite;
         }

         .wake-word-button.active:hover {
            background: rgba(0, 255, 100, 0.25);
            box-shadow: 0 0 30px rgba(0, 255, 100, 0.4);
         }

         @keyframes pulse-wake {
             0%, 100% { box-shadow: 0 0 15px rgba(0, 255, 100, 0.3); }
             50% { box-shadow: 0 0 25px rgba(0, 255, 100, 0.6); }
         }

         .waveform {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 220px;
            height: 220px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
         }

         .record-button.recording .waveform {
            opacity: 1;
         }

         .text-display {
            position: relative;
            z-index: 1;
            text-align: center;
            min-height: 80px;
            max-width: 90%;
            padding: 20px;
         }

         .transcription, .response {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #00d4ff;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
         }

         .transcription.visible, .response.visible {
            opacity: 1;
            transform: translateY(0);
         }

         .transcription {
            margin-bottom: 20px;
            font-style: italic;
         }

         .response {
            font-weight: 500;
         }

         .spinner {
            display: none;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0, 212, 255, 0.2);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
         }

         .spinner.visible {
            display: block;
         }

         @keyframes spin {
            to { transform: rotate(360deg); }
         }

         .footer {
            position: relative;
            z-index: 1;
            margin-top: 40px;
            padding: 20px;
            text-align: center;
            font-size: 0.8rem;
            color: rgba(0, 212, 255, 0.5);
            letter-spacing: 1px;
         }

         .ip-hint {
            color: rgba(0, 212, 255, 0.7);
            margin-top: 10px;
            font-family: monospace;
         }

         .error-message {
            color: #ff4444;
            font-size: 0.9rem;
            padding: 10px 20px;
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid rgba(255, 68, 68, 0.3);
            border-radius: 8px;
            margin-top: 20px;
            display: none;
         }

         .error-message.visible {
            display: block;
         }

         @media (max-width: 768px) {
             .title {
                font-size: 2rem;
                letter-spacing: 4px;
             }
             .record-button {
                width: 150px;
                height: 150px;
             }
             .waveform {
                width: 190px;
                height: 190px;
             }
             .transcription, .response {
                font-size: 1rem;
             }
             .wake-word-button {
                min-width: 240px;
             }
         }

         @media (max-width: 480px) {
             .title {
                font-size: 1.5rem;
                letter-spacing: 2px;
             }
             .record-button {
                width: 130px;
                height: 130px;
             }
             .button-icon {
                width: 50px;
                height: 50px;
             }
             .wake-word-button {
                min-width: 200px;
                font-size: 0.85rem;
                padding: 10px 16px;
             }
         }
     </style>
</head>
<body>
     <div class="particles" id="particles"></div>

     <header class="header">
         <h1 class="title">J.A.R.V.I.S</h1>
         <p class="subtitle">Voice Assistant</p>
     </header>

     <div class="status-container">
         <div class="status-indicator">
             <div class="status-dot" id="statusDot"></div>
             <span id="statusText">Connecting...</span>
         </div>
     </div>

     <div class="button-container">
         <button class="record-button" id="recordButton" aria-label="Hold to speak">
             <svg class="button-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                 <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                 <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
             </svg>
             <canvas class="waveform" id="waveformCanvas" width="220" height="220"></canvas>
         </button>

         <button class="wake-word-button" id="wakeWordButton" aria-label="Enable wake word detection">
             <span id="wakeWordIcon">🎤</span>
             <span id="wakeWordText">Ativar "Jarvis" (wake word)</span>
         </button>

         <button class="wake-word-button active" id="voiceToggleButton" aria-label="Toggle voice response">
             <span id="voiceToggleIcon">🔊</span>
             <span id="voiceToggleText">Resposta por voz: ON</span>
         </button>

         <div class="text-display">
             <div class="transcription" id="transcription"></div>
             <div class="spinner" id="spinner"></div>
             <div class="response" id="response"></div>
         </div>

         <div class="error-message" id="errorMessage"></div>
     </div>

     <footer class="footer">
         <p>Hold to speak • Release to send</p>
         <p class="ip-hint" id="ipHint">Discovering IP...</p>
     </footer>

     <script src="app.js"></script>
</body>
</html>
