name: macOS CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build native macOS app
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build Swift package
        run: |
          SWIFTPM_CACHE_PATH=.swiftpm-cache \
          CLANG_MODULE_CACHE_PATH=.clang-cache \
          swift build --package-path macos/JarvisMenuBar
