services:
  jarvis-voice:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CERT_CN: ${JARVIS_CERT_CN:-localhost}
        CERT_SAN: ${JARVIS_CERT_SAN:-DNS:localhost,IP:127.0.0.1}
    container_name: jarvis-voice
    ports:
       - "127.0.0.1:8765:8765"
    extra_hosts:
       - "host.docker.internal:host-gateway"
    environment:
       - TZ=America/Sao_Paulo
       - OPENCLAW_URL=http://host.docker.internal:18789
       - OPENCLAW_TOKEN=${OPENCLAW_TOKEN:-}
       - OPENCLAW_AGENT=it-infrastructure-specialist
       - JARVIS_CLIENT_TOKEN=${JARVIS_CLIENT_TOKEN:?set JARVIS_CLIENT_TOKEN in .env for legacy web/iPad access}
       - WHISPER_MODEL=${WHISPER_MODEL:-small}
       - WHISPER_BEAM_SIZE=${WHISPER_BEAM_SIZE:-3}
       - WHISPER_VAD_MIN_SILENCE_MS=${WHISPER_VAD_MIN_SILENCE_MS:-450}
       - WHISPER_NO_SPEECH_THRESHOLD=${WHISPER_NO_SPEECH_THRESHOLD:-0.45}
       - WHISPER_INITIAL_PROMPT=${WHISPER_INITIAL_PROMPT:-}
       - STT_NORMALIZATION_ENABLED=${STT_NORMALIZATION_ENABLED:-true}
       - TTS_VOICE=${TTS_VOICE:-pt-BR-AntonioNeural}
       - HOST_IP=0.0.0.0
       - HOST_PORT=8765
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import ssl, urllib.request; ctx = ssl._create_unverified_context(); urllib.request.urlopen('https://localhost:8765/', context=ctx, timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
